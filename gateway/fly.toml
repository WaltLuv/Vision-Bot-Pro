# VisionClaw gateway, hosted so the app no longer depends on a machine at home.
#
#   fly apps create visionclaw-gateway
#   fly volumes create gateway_data --size 5 --region sjc -a visionclaw-gateway
#   fly secrets set ANTHROPIC_API_KEY=... GOOGLE_CLIENT_SECRET=... \
#                   STATE_SECRET=... SIGNIN_VAULT_KEY=... GATEWAY_TOKENS=... -a visionclaw-gateway
#   (SIGNIN_VAULT_KEY: openssl rand -hex 32. It encrypts saved retailer sign-ins on
#    the volume; changing it forgets them. Hermes is in the image: see Dockerfile.)
#   fly deploy --config gateway/fly.toml --dockerfile Dockerfile .
#   fly certs add api.visionagents.app -a visionclaw-gateway
#
# Deploy from the REPOSITORY ROOT, not from gateway/. The image builds the phone
# client as well as the gateway, and the gateway resolves that build relative to
# its own source, so web/ has to be inside the build context. Deploying with
# gateway/ as the context produces a gateway that serves nothing on '/'.
#
# The OAuth redirect is derived from PUBLIC_BASE_URL, so that exact host must be
# an authorized redirect URI on the Google OAuth client.

app = 'visionclaw-gateway'
primary_region = 'sjc'

[build]
  # Repository-root Dockerfile: builds web/ and gateway/ into one image.
  dockerfile = 'Dockerfile'

[env]
  PORT = '8788'
  PUBLIC_BASE_URL = 'https://api.visionagents.app'
  # On the volume: this file maps each user to their CMA session, vault, and
  # memory store. Losing it strands those resources and silently re-provisions
  # empty ones, so it must outlive any single machine.
  STORE_PATH = '/data/gateway-store.json'
  # Durable employee records, artifacts and per-owner Hermes homes. Defaults to
  # the store file's directory, but naming it keeps the volume explicit.
  EMPLOYEE_DATA_DIR = '/data'
  WORKSPACE_MCP_URL = 'https://mcp.visionagents.app/mcp'
  AGENT_MODEL = 'claude-sonnet-5'
  AGENT_EFFORT = 'none'
  QUICK_ANSWER_TIMEOUT_MS = '45000'
  # GOOGLE_CLIENT_ID is set with `fly secrets set` rather than living here, so a
  # fork brings its own OAuth client instead of pointing at someone else's
  # consent screen and unverified-user quota.

[http_service]
  internal_port = 8788
  force_https = true
  # Deliberately always-on, unlike the MCP server. Deferred turns are awaited
  # in-process and pushed over a held-open WebSocket, so a stopped machine drops
  # results that are still in flight rather than merely adding a cold start.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Readiness, so a machine that came up without a usable process is replaced
  # rather than left serving errors.
  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

# 5 GB on the machine's NVMe: the SQLite database and cache, artifacts, per-owner
# Hermes homes and the encrypted sign-in vault. initial_size only applies when
# Fly creates the volume itself; one made by hand above is made at 5 GB there.
[[mounts]]
  source = 'gateway_data'
  destination = '/data'
  initial_size = '5gb'

# Two shared CPUs: Node serves the app while Hermes runs tasks in Python beside
# it. 2 GB, because one Hermes process per running task plus Playwright's CDP
# connections to Browserbase do not fit the 512 MB default of this size.
[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
